apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: bookreview
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/bijay-05/bookreview-app-infra.git
    targetRevision: main
    path: manifests
    # ArgoCD renders kustomization.yaml (image tags live there, not in deployment sed)
  destination:
    server: https://kubernetes.default.svc
    namespace: bookreview
  syncPolicy:
    automated:
      prune: true # remove resources deleted from Git
      selfHeal: true # revert any manual kubectl changes — the GitOps contract
    syncOptions:
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
  revisionHistoryLimit: 10
