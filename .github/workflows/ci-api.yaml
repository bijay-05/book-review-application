name: BookReview API DevSecOps Pipeline (GitHub)

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "frontend/**"

env:
  FULL_COMMIT_SHA: ${{ github.sha }}
  TRIVY_VERSION: "0.70.0"
  DOCKER_BUILDKIT: "1"
  TRIVY_TIMEOUT: 15m
  GRYPE_DB_MAX_ALLOWED_BUILT_AGE: 336h
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_IMAGE_REGISTRY: ${{ secrets.AWS_ECR_IMAGE_REGISTRY }}

jobs:
  # ───────────────────────────────────────────────────────────────────────────
  # GATE 1: SECRETS SCAN!
  # Catch hardcoded secrets before anything else runs.
  # A leaked secret is a breach. Stop everything if one is found.
  # ───────────────────────────────────────────────────────────────────────────
  secrets-scan:
    name: "Secrets Scan (Gitleaks)"

    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history for secrets scan)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history — scan every commit, not just HEAD

      - name: Install Gitleaks (secrets detection engine)
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz \
            | tar -xz
          sudo mv gitleaks /usr/local/bin/

      - name: Run Gitleaks (fail if any secret found)
        run: |
          gitleaks detect \
            --source . \
            --verbose \
            --report-format json \
            --report-path api-gitleaks-report.json

      - name: Upload Gitleaks report (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: api-gitleaks-report.json

  # ───────────────────────────────────────────────────────────────────────────
  # GATE 2: SAST
  # Static analysis — find security issues in TypeScript/JavaScript code.
  # ───────────────────────────────────────────────────────────────────────────
  sast:
    name: "SAST (Semgrep)"

    runs-on: ubuntu-latest
    needs: secrets-scan
    steps:
      - name: Checkout code (SAST runs on source)
        uses: actions/checkout@v4

      - name: Install Semgrep (OWASP-focused rulesets)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip
          python3 -m pip install --user semgrep
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run Semgrep (fail on findings)
        run: |
          semgrep \
            --config=p/javascript \
            --config=p/nestjs \
            --config=p/security-audit \
            --config=p/secrets \
            --config=p/owasp-top-ten \
            --error \
            --json \
            --output api-semgrep-results.json \
            backend/

      - name: Upload Semgrep results (evidence)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: api-semgrep-results.json

  detect-changes:
    name: "Detect changed services"
    runs-on: ubuntu-latest
    needs: secrets-scan
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'frontend/**'
            api:
              - 'backend/**'

  build-image:
    name: "Build Docker Image"
    runs-on: ubuntu-latest
    needs: [sast, detect-changes]
    if: |
      needs.detect-changes.outputs.web   == 'true' ||
      needs.detect-changes.outputs.api   == 'true'
    env:
      BUILD_WEB: ${{ needs.detect-changes.outputs.web }}
      BUILD_API: ${{ needs.detect-changes.outputs.api }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker Image
        run: |
          IMAGE_TAG=${FULL_COMMIT_SHA::6}
          build() { local svc=$1 dir=$2
            docker build -t "bookreview-${svc}:${IMAGE_TAG}" "./${dir}"
            IMAGES="${IMAGES} bookreview-${svc}:${IMAGE_TAG}"
          }
          [ "$BUILD_WEB"    = "true" ] && build web  frontend
          [ "$BUILD_API"    = "true" ] && build api  backend
          docker save -o images.tar ${IMAGES}
      - name: Upload built image
        uses: actions/upload-artifact@v4
        with:
          name: built-image
          path: images.tar
          retention-days: 1

  scan-image:
    name: "Scan Docker Images (Trivy)"
    runs-on: ubuntu-latest
    needs: [build-image, detect-changes]
    env:
      BUILD_WEB: ${{ needs.detect-changes.outputs.auth }}
      BUILD_API: ${{ needs.detect-changes.outputs.ledger }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: built-image
      - name: Trivy Scan Docker Images (HIGH/CRITICAL block)
        run: |
          IMAGE_TAG=${FULL_COMMIT_SHA::6}
          docker load -i images.tar
          scan() { local img=$1
            echo "→ Trivy: ${img}"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              aquasec/trivy:latest image --exit-code 1 \
              --severity CRITICAL,HIGH --ignore-unfixed "${img}"
          }
          [ "$BUILD_WEB"   = "true" ] && scan "bookreview-web:${IMAGE_TAG}"
          [ "$BUILD_API"   = "true" ] && scan "bookreview-api:${IMAGE_TAG}"

  publish-images:
    name: "Publish Image To AWS ECR"
    runs-on: ubuntu-latest
    needs: [scan-image, detect-changes]
    env:
      BUILD_WEB: ${{ needs.detect-changes.outputs.web }}
      BUILD_API: ${{ needs.detect-changes.outputs.api }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup AWS Credentials
        run: |
          mkdir ~/.aws && touch ~/.aws/credentials && touch ~/.aws/config
          echo "[default]" > ~/.aws/credentials
          echo "aws_access_key_id=$AWS_ACCESS_KEY_ID" >> ~/.aws/credentials
          echo "aws_secret_access_key=$AWS_SECRET_ACCESS_KEY" >> ~/.aws/credentials
          echo "[default]" > ~/.aws/config
          echo "region=$AWS_REGION" >> ~/.aws/config

      - name: Log in to AWS ECR
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd

      - uses: actions/download-artifact@v4
        with:
          name: built-image

      - name: Push and sign all images
        env:
          COSIGN_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
        run: |
          IMAGE_TAG=${FULL_COMMIT_SHA::6}
          docker load -i image.tar
          chmod +x scripts/ci-publish-image.sh
          publish() { local local_tag=$1 ecr_tag=$2
            bash scripts/ci-publish-image.sh "${local_tag}" "${ecr_tag}" ""
          }
          [ "$BUILD_WEB"    = "true" ] && publish "bookreview-web:${IMAGE_TAG}"   "${ECR_IMAGE_REGISTRY}/book-review-app/web:${IMAGE_TAG}"
          [ "$BUILD_API"  = "true" ] && publish "bookreview-api:${IMAGE_TAG}"   "${ECR_IMAGE_REGISTRY}/book-review-app/api:${IMAGE_TAG}"

  update-manifests:
    name: "Update GitOps manifests (kustomization.yaml)"
    runs-on: ubuntu-latest
    needs: [publish-images]
    env:
      BUILD_WEB: ${{ needs.detect-changes.outputs.web }}
      BUILD_API: ${{ needs.detect-changes.outputs.api }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: app

      - name: Checkout infra repo (GitOps target)
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/bookreview-app-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      - name: Update only changed service tags in kustomization
        run: |
          set -euo pipefail
          if ! command -v kustomize &>/dev/null; then
            curl -sL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.4.3/kustomize_v5.4.3_linux_amd64.tar.gz" \
              | tar xz && sudo mv kustomize /usr/local/bin/
          fi
          IMAGE_TAG=${FULL_COMMIT_SHA::6}
          export IMAGE_TAG=$IMAGE_TAG
          rsync -a --delete \
            app/manifests/ infra/manifests/
          cd infra/manifests
          [ "$BUILD_WEB"    = "true" ] && kustomize edit set image \
            book-review-app/web=${ECR_IMAGE_REGISTRY}/book-review-app/web:$IMAGE_TAG
          [ "$BUILD_API" = "true" ] && kustomize edit set image \
            book-review-app/api=${ECR_IMAGE_REGISTRY}/book-review-app/api:$IMAGE_TAG
          kustomize build . >/dev/null
          echo "✓ kustomize build OK"

      - name: Commit and push (ArgoCD syncs book-review-app cluster)
        run: |
          IMAGE_TAG=${FULL_COMMIT_SHA::6}
          cd infra/
          git config user.email "github-ci@bookreview-app"
          git config user.name "GitHub Actions Bot"
          git add "manifests/kustomization.yaml"
          if git diff --staged --quiet; then
            echo "No manifest changes"
          else
            git commit -m "ci: deploy ${{ env.IMAGE_TAG }} to cluster [skip ci]"
            git push
          fi
